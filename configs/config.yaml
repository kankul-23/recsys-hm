# recsys-hm — централизованный конфиг проекта
# =============================================================================

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  models: "models"

# -----------------------------------------------------------------------------
# Temporal split — даты отсечки. Заполнены на Фазе 2 (EDA) на основе
# реального распределения транзакций в датасете.
# -----------------------------------------------------------------------------
temporal_split:
  train_end: "2020-08-11"
  valid_end: "2020-09-01"
  test_end: "2020-09-22"

# -----------------------------------------------------------------------------
# Фильтрация аномальных покупателей (Фаза 3).
#
# Порог фиксированный (не перцентиль), подобран по итогам визуального анализа
# распределения числа транзакций на покупателя в train.
# Чистый p99 (=180) резал бы 79% отсечённых из
# диапазона 181-300 транзакций — это правдоподобные лояльные покупатели
# (0.5-1 покупка/день), а не аномалии. Настоящий разрыв в распределении
# начинается в районе 500: выше этой границы остаётся всего 390 покупателей
# (374 в 501-1000, 16 в 1000+) — их поведение (до 1819 транзакций за
# ~11 месяцев, то есть несколько покупок в день без остановки) уже не похоже
# на розничного покупателя.
#
# Порог применяется ТОЛЬКО к train (см. src/data/split.py) — не используется
# полная история покупателя за весь датасет, чтобы не подсматривать в
# поведение покупателя из будущего периода (после train_end).
# -----------------------------------------------------------------------------
anomaly_filter:
  max_transactions: 500   # фиксированный порог, покупатели с count > 500 удаляются из train

# -----------------------------------------------------------------------------
# Stage 1: Candidate Generation — Implicit ALS
#
# confidence_alpha (Фаза 5): вес наблюдения в матрице User x Item считается
# как 1 + confidence_alpha * count, где count — число покупок (юзер, товар)
# на train (см. Hu, Koren, Volinsky, 2008 — оригинальная статья Implicit
# ALS). 40 — стандартное значение по умолчанию в большинстве реализаций,
# включая библиотеку implicit; не подбиралось под этот датасет отдельно,
# как и остальные гиперпараметры ALS/CatBoost на этом этапе.
# -----------------------------------------------------------------------------
als:
  factors: 64
  iterations: 15
  regularization: 0.05
  top_k_candidates: 100
  random_state: 42
  confidence_alpha: 40

# -----------------------------------------------------------------------------
# Negative sampling для обучающего датасета ранкера
# -----------------------------------------------------------------------------
negative_sampling:
  ratio: 4   # 1 positive : 4 negative

# -----------------------------------------------------------------------------
# Stage 2: Reranking — CatBoostRanker
# -----------------------------------------------------------------------------
ranker:
  loss_function: "YetiRank"
  iterations: 500
  learning_rate: 0.05
  depth: 6
  random_state: 42

# -----------------------------------------------------------------------------
# Offline evaluation
# -----------------------------------------------------------------------------
evaluation:
  k_values: [10, 100]   # для Recall@K, NDCG@K, MAP@K

# -----------------------------------------------------------------------------
# Serving
# -----------------------------------------------------------------------------
service:
  default_top_k: 10
  host: "0.0.0.0"
  port: 8000
