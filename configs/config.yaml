# recsys-hm — централизованный конфиг проекта
# =============================================================================

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  models: "models"

# -----------------------------------------------------------------------------
# Temporal split — даты отсечки. Заполняются на Фазе 2 (EDA) на основе
# реального распределения транзакций в датасете. Пока placeholder-ы.
# -----------------------------------------------------------------------------
temporal_split:
  train_end: "2020-08-11"
  valid_end: "2020-09-01"
  test_end: "2020-09-22"
# -----------------------------------------------------------------------------
# Stage 1: Candidate Generation — Implicit ALS
# -----------------------------------------------------------------------------
als:
  factors: 64
  iterations: 15
  regularization: 0.05
  top_k_candidates: 100
  random_state: 42

# -----------------------------------------------------------------------------
# Negative sampling для обучающего датасета ранкера
# -----------------------------------------------------------------------------
negative_sampling:
  ratio: 4   # 1 positive : 4 negative

# -----------------------------------------------------------------------------
# Stage 2: Reranking — CatBoostRanker
# -----------------------------------------------------------------------------
ranker:
  loss_function: "YetiRank"
  iterations: 500
  learning_rate: 0.05
  depth: 6
  random_state: 42

# -----------------------------------------------------------------------------
# Offline evaluation
# -----------------------------------------------------------------------------
evaluation:
  k_values: [10, 100]   # для Recall@K, NDCG@K, MAP@K

# -----------------------------------------------------------------------------
# Serving
# -----------------------------------------------------------------------------
service:
  default_top_k: 10
  host: "0.0.0.0"
  port: 8000
